# Paper accounts, accounts-v2 (pre-registrations A10, A11 and A12, 2026-11-01): the Combined Bot (all strategies,
# one trade), the Trend-Led Bot (Trend Rider leads, the others time entries) and the four styles, each also trading on its own.
# They replace the A8 accounts in accounts-v1.yaml, which are retired (their trades and reviews stay in the journal).
# Changing anything here makes accounts-v3 and needs a new amendment. Paper money only.
version: 2
round_length: 30
floor: 5000.0
balance: 10000.0
retired: [acct-a, acct-b, acct-c, acct-d]
accounts:
- id: acct-combined
  name: Combined Bot
  style: X1
  risk: 0.01
  leverage: 2.0
  daily_brake: 0.03
  park: false        # A13: no idle-money hedge (its switching costs exceeded the funding)
- id: acct-trend-bot
  name: Trend-Led Bot
  style: X2
  risk: 0.01
  leverage: 2.0
  daily_brake: 0.03
  park: false        # A13: no idle-money hedge (its switching costs exceeded the funding)
- id: acct-trend
  name: Trend Rider
  style: T1
  risk: 0.01
  leverage: 2.0
  daily_brake: 0.03
- id: acct-range
  name: Range Trader
  style: R1
  risk: 0.01
  leverage: 2.0
  daily_brake: 0.03
- id: acct-breakout
  name: Breakout Hunter
  style: B1
  risk: 0.01
  leverage: 2.0
  daily_brake: 0.03
- id: acct-carry
  name: Funding Collector
  style: C1
  hedge: 0.6
  review_days: 30
