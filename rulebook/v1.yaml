confluence:                        # owner Tab 3: +1 / -1 / 0 per factor, signed toward the trade's side
  - {factor: ema_stack_1h, rule: 'sign toward side'}
  - {factor: adx_1h, rule: '>= 25 with the 1h EMA stack: +1 toward, -1 against'}
  - {factor: rsi_15m, rule: '> 55 bullish, < 45 bearish'}
  - {factor: volume_z_15m, rule: '>= 1.5: +1 (participation)'}
  - {factor: taker_share_15m, rule: '>= 0.55 bullish, <= 0.45 bearish'}
  - {factor: vwap_z, rule: 'above VWAP bullish, below bearish'}
  - {factor: oi_price_state, rule: 'longs opening bullish; shorts opening bearish; closing states count against their side'}
  - {factor: funding_z, rule: '<= -1.5 favours longs, >= 1.5 favours shorts'}
  - {factor: range_pos_4h, rule: '<= 0.3 room up, >= 0.7 room down'}

diagnostics:                       # owner Tab 4, measured in R after costs
  FAIL_STOP_HUNT: 'stopped out, then the original target was reached within 4h of the exit'
  FAIL_GREEDY_TP: 'net loss after reaching at least 75% of the way to the target'
  FAIL_FADED_IMPULSE: 'stopped out with favourable excursion under 0.15R'
  FAIL_CHOP_BLEED: 'time exit with |net| under the round-trip cost'
  PASS_CLEAN: 'net win with adverse excursion under 0.5R'
  PASS_GRIND: 'net win after adverse excursion of at least 0.75R'
  SKIP_GOOD_AVOID: 'skipped; the simulated trade lost'
  SKIP_MISSED_WIN: 'skipped; the simulated trade won with adverse excursion under 0.5R'
  SKIP_NEUTRAL: 'skipped; any other simulated outcome'
  STANDARD_VARIANCE: 'any other taken trade'
