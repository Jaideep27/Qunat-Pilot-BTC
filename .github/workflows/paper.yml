name: paper-worker
# Legacy cloud paper worker for the frozen research release. Manual runs only: it needs a hosted database
# (secret QUANTPILOT_DATABASE_URL), and the live system now runs locally.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: paper-account
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      QUANTPILOT_DATABASE_URL: ${{ secrets.QUANTPILOT_DATABASE_URL }}
      QUANTPILOT_ARTIFACT_DIR: release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Require persistent operational database
        run: |
          test -n "$QUANTPILOT_DATABASE_URL" || { echo "Set QUANTPILOT_DATABASE_URL to the Supabase pooler URL"; exit 1; }
      - uses: actions/cache@v4
        with:
          path: data/live
          key: live-${{ github.run_id }}
          restore-keys: live-
      - run: pip install --require-hashes -r requirements.lock
      - run: pip install --no-deps .
      - run: quantpilot init-db
      - run: quantpilot worker

